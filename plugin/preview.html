<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leedly AI Visibility Scan</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172539; background: #eff4f4; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100% - 32px, 880px); margin: 40px auto 72px; }
    header { padding: 28px; background: #122b33; color: #f6fffd; border-radius: 16px; }
    header p { margin-bottom: 0; color: #d1eae6; }
    h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.8rem); letter-spacing: -.04em; }
    h2 { margin: 0 0 14px; font-size: 1.25rem; }
    h3 { margin: 0 0 8px; font-size: 1rem; }
    section { background: white; margin-top: 16px; padding: 24px; border: 1px solid #d4e0df; border-radius: 16px; }
    .notice { background: #dff2ec; color: #174439; padding: 12px 15px; border-radius: 8px; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 10px; }
    .metric { background: #eff5f4; padding: 13px; border-radius: 8px; }
    .metric strong { display: block; font-size: 1.5rem; }
    details { border-top: 1px solid #d4e0df; padding: 12px 0; }
    summary { cursor: pointer; font-weight: 650; }
    details p { margin: 8px 0; }
    a { color: #075e58; overflow-wrap: anywhere; }
    a:focus-visible, summary:focus-visible { outline: 3px solid #187b6d; outline-offset: 3px; }
    li + li { margin-top: 7px; }
    .source { color: #435665; font-size: .9rem; }
    [hidden] { display: none; }
  </style>
  <script type="module" src="/view.js"></script>
</head>
<body>
  <main>
    <header><h1>Leedly AI Visibility Scan</h1><p id="scope"></p></header>
    <p class="notice" id="status" role="status">Loading sample report…</p>
    <div id="report" hidden>
      <section><h2>Sample coverage</h2><div class="metrics" id="metrics"></div><p class="source" id="source"></p></section>
      <section><h2>Buyer questions</h2><div id="questions"></div></section>
      <section><h2>Buyer keyword opportunities</h2><p class="source">Suggested phrases based on the sample questions.</p><ul id="keywords"></ul></section>
      <section><h2>Prioritized actions</h2><ol id="actions"></ol></section>
      <section><h2>Content brief</h2><div id="brief"></div></section>
    </div>
  </main>
</body>
</html>
